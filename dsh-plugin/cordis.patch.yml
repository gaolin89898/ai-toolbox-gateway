- insert:
    - id: workbuddy-accounts
      name: dsh-workbuddy-accounts
      config:
        backendPort: 7863
# 复用 dsh-base 的 pi-ai 适配器。此处必须是顶层定向补丁，
# 放入 insert 会重复注册 llm-pi-ai，使实时设置写入失败。
# 模型目录保留思考强度与输入模态；管理密钥引用 WB2API_GATEWAY_API_KEY。
# 初始目录由 scripts/generate-dsh-provider-models.mjs 生成；切换供应应用后
# 插件通过 DSH 设置服务自动获取并实时更新可用模型。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      workbuddy-gateway:
        displayName: "AI 工具箱网关"
        api: openai-completions
        baseURL: "http://127.0.0.1:7863/v1"
        apiKeyEnv: WB2API_GATEWAY_API_KEY
        defaultInput:
          - "text"
        models:
          - id: "doubao/person-deepseek-v4-1-flash-261017"
            name: "DeepSeek V4.1 Flash"
            contextWindow: 300000
            input:
              - "text"
            reasoningEfforts:
              low: "low"
              medium: "medium"
              high: "high"
              xhigh: "xhigh"
              max: "max"
          - id: "doubao/person-deepseek-v4-pro-ga-260813"
            name: "DeepSeek V4 Pro"
            contextWindow: 300000
            input:
              - "text"
            reasoningEfforts:
